[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autodrift"
version = "0.1.0"
description = "Simulation-first engineering environment for friction-adaptive autonomous drifting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=0.29",
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.0",
  "matplotlib>=3.7",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
autodrift-evaluate = "autodrift.evaluate:main"
autodrift-train-ppo = "autodrift.train_ppo:main"
autodrift-benchmark = "autodrift.benchmark:main"
autodrift-rollout = "autodrift.rollout:main"
autodrift-scenarios = "autodrift.scenarios:main"
autodrift-latent-probe = "autodrift.latent_probe:main"
autodrift-scenario-corpus = "autodrift.scenario_corpus:main"
autodrift-hard-response-corpus = "autodrift.hard_response_corpus:main"
autodrift-hidden-swap-gate = "autodrift.hidden_swap_gate:main"
autodrift-matched-response-corpus = "autodrift.matched_response_corpus:main"
autodrift-m7-gate = "autodrift.m7_gate:main"
autodrift-research-cycle = "autodrift.research_cycle:main"
autodrift-rollout-throughput = "autodrift.rollout_throughput:main"
autodrift-paired-hidden-snapshots = "autodrift.paired_hidden_snapshots:main"
autodrift-seed-delta-audit = "autodrift.seed_delta_audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
