[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autodrift"
version = "0.1.0"
description = "Simulation-first engineering environment for friction-adaptive autonomous drifting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=0.29",
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.0",
  "matplotlib>=3.7",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
autodrift-evaluate = "autodrift.evaluate:main"
autodrift-train-ppo = "autodrift.train_ppo:main"
autodrift-benchmark = "autodrift.benchmark:main"
autodrift-rollout = "autodrift.rollout:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
